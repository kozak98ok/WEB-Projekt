<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2117"/>
      <stop offset="100%" stop-color="#17140f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99a3d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c99a3d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="320" fill="url(#sky)"/>
  <circle cx="640" cy="90" r="120" fill="url(#glow)"/>

  <!-- distant skyline -->
  <g fill="#1e1912" opacity="0.9">
    <rect x="0" y="190" width="60" height="130"/>
    <rect x="70" y="160" width="45" height="160"/>
    <rect x="125" y="205" width="70" height="115"/>
    <rect x="205" y="150" width="50" height="170"/>
    <rect x="265" y="185" width="60" height="135"/>
    <rect x="335" y="140" width="55" height="180"/>
    <rect x="400" y="200" width="80" height="120"/>
    <rect x="490" y="170" width="50" height="150"/>
    <rect x="550" y="210" width="65" height="110"/>
    <rect x="625" y="155" width="55" height="165"/>
    <rect x="690" y="195" width="60" height="125"/>
    <rect x="755" y="175" width="45" height="145"/>
  </g>

  <!-- lit windows -->
  <g fill="#c99a3d" opacity="0.55">
    <rect x="15" y="210" width="6" height="8"/>
    <rect x="35" y="230" width="6" height="8"/>
    <rect x="85" y="185" width="6" height="8"/>
    <rect x="95" y="220" width="6" height="8"/>
    <rect x="215" y="175" width="6" height="8"/>
    <rect x="230" y="200" width="6" height="8"/>
    <rect x="345" y="165" width="6" height="8"/>
    <rect x="360" y="195" width="6" height="8"/>
    <rect x="420" y="225" width="6" height="8"/>
    <rect x="440" y="250" width="6" height="8"/>
    <rect x="635" y="180" width="6" height="8"/>
    <rect x="650" y="210" width="6" height="8"/>
  </g>

  <!-- foreground street + lamp -->
  <rect x="0" y="290" width="800" height="30" fill="#0f0d09"/>
  <line x1="120" y1="230" x2="120" y2="292" stroke="#0f0d09" stroke-width="5"/>
  <path d="M120 230 q0 -14 22 -14" fill="none" stroke="#0f0d09" stroke-width="5"/>
  <circle cx="142" cy="216" r="9" fill="#c99a3d" opacity="0.9"/>
  <circle cx="142" cy="216" r="26" fill="#c99a3d" opacity="0.18"/>

  <!-- lone figure -->
  <g fill="#0f0d09">
    <ellipse cx="600" cy="300" rx="10" ry="4"/>
    <path d="M598 300 C596 280 596 260 600 245 C602 238 610 238 612 245 C616 260 616 280 614 300 Z"/>
    <circle cx="606" cy="236" r="8"/>
  </g>

  <!-- rust accent line -->
  <rect x="0" y="313" width="800" height="4" fill="#b3402a" opacity="0.8"/>
</svg>
